objective: |
  Proactive interventions are stamped with epoch ms (~1.76e12) while every other producer uses ms since meeting start, overflowing the integer column and stretching the dashboard timeline to ~55 years. After this task all backend-generated timestamps use session.elapsed_ms(), and timestamp columns are bigint.
scope:
  in:
  - Add `started_at_monotonic` to LiveGraphSession (set on creation / first WS connect) and `elapsed_ms()`
  - Replace wall-clock lambdas at backend/main.py:387 and :453 and backend/agents/raising_hand_agent.py:610 with session.elapsed_ms()
  - Create supabase/migrations/004_timestamp_bigint.sql altering timestamp_ms columns (transcript_turns, diagram_snapshots, agent_interventions,
    any others in 001) to bigint
  - 'Tests: proactive intervention timestamp < 24h in ms; _get_recent_context finds turns within the window'
  out:
  - Applying the migration remotely (task 15)
  - Dashboard timeline UI changes
files:
  backend/session_manager.py: LiveGraphSession.started_at_monotonic + elapsed_ms()
  backend/main.py: use elapsed_ms at :387, :453
  backend/agents/raising_hand_agent.py: use injected timestamp fn consistently (:610)
  supabase/migrations/004_timestamp_bigint.sql: create
  backend/test_agents.py: add tests
implementation_notes: |
  Use time.monotonic(). If the Lens handshake ever carries a start time, prefer it — not required now. Check 001_initial_schema.sql for every `timestamp_ms` column.
