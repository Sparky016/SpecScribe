objective: |
  Proactive interventions are stamped with epoch ms (~1.76e12) while every other producer uses ms since meeting start, overflowing the integer column and stretching the dashboard timeline to ~55 years. After this task all backend-generated timestamps use session.elapsed_ms(), and timestamp columns are bigint.
