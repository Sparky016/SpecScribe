objective: |
  Deliver on the MVP requirement that "the app should listen to each person's
  conversation, transcribe it, and as they speak it should reason through what is
  being said". Currently, PersistentStreamSocketClient.ts:263 hardcodes every ASR
  turn to `speaker_label: 'Speaker 0 (Wearer)'`, and although `deepgram-sdk==7.13.0`
  is installed in `backend/requirements.lock` and `DEEPGRAM_API_KEY` is configured
  in CI/CD, zero code in the repository performs speaker diarization or multi-speaker
  attribution.
scope:
  in:
    - backend/envelope_router.py
    - backend/services/diarization.py
    - spectacles-lens/Assets/Scripts/PersistentStreamSocketClient.ts
    - backend/tests/test_diarization.py
    - spectacles-lens/test/persistent_stream_socket_client.test.ts
  out:
    - Hardware microphone array beamforming on Spectacles OS
files:
  backend/services/diarization.py: 'Create SpeakerDiarizer service supporting (a) Deepgram Nova-2 diarization (`diarize=True`) when raw audio/PCM chunks (`audioChunk` envelope) or audio URLs are provided, and (b) conversational turn-taking / acoustic-pause + LLM speaker-role inference fallback when only Snap AsrModule text envelopes (`asrTranscription`) are available.'
  backend/envelope_router.py: 'Integrate SpeakerDiarizer in AsrHandler (and optional AudioChunkHandler) so transcript turns receive distinct speaker labels (e.g., "Speaker 0 (Wearer)", "Speaker 1", "Speaker 2") instead of a single hardcoded label.'
  spectacles-lens/Assets/Scripts/PersistentStreamSocketClient.ts: 'Include utterance gap metadata (`silenceDurationMs`, `turnIndex`) in `asrTranscription` payloads and omit hardcoded "Speaker 0 (Wearer)" override when backend diarization is active.'
  backend/tests/test_diarization.py: 'Unit tests for Deepgram diarization adapter and conversational speaker-turn attribution fallback.'
implementation_notes: |
  1. Why two paths are needed:
     - On Snap Spectacles (2024 / SPECS 27), `LensStudio:AsrModule` outputs text strings
       without speaker IDs. However, Spectacles also supports microphone `AudioTrackAsset` /
       PCM capture OR text-plus-pause metadata (`silenceDurationMs` between utterances).
  2. Create `backend/services/diarization.py`:
     - **Path A (Deepgram Audio Diarization)**: When `DEEPGRAM_API_KEY` is configured and
       an `audioChunk` (base64 WAV/PCM) is received, call `deepgram-sdk` with
       `model="nova-2"`, `diarize=True`, `smart_format=True` to obtain per-word/per-utterance
       `speaker` indices (`Speaker 0`, `Speaker 1`, etc.).
     - **Path B (ASR Text + Pause & Contextual Speaker Attribution)**: When `asrTranscription`
       arrives from `LensStudio:AsrModule` with `silenceDurationMs` and optional self-intro
       cues (e.g., conversational handoffs, question-answer adjacency pairs, or explicit speaker
       tags in demo mode), infer speaker transitions and assign consistent labels
       (`Speaker 0 (Wearer)`, `Speaker 1 (Participant)`, `Speaker 2 (Participant)`).
  3. In `PersistentStreamSocketClient.ts`:
     - Track `lastUtteranceTimestampMs` in `initializeAsrStream()`.
     - Send `silenceGapMs: Date.now() - this.lastUtteranceTimestampMs` and `speaker_label: payloadSpeaker || 'auto'`
       so the backend diarizer can distinguish speaker handoffs while preserving explicit
       labels passed by `sendSimulatedVoiceNote(text, speaker)`.
acceptance_criteria:
  - id: AC1
    behavior: 'When audio chunks are processed with DEEPGRAM_API_KEY set (or mocked Deepgram client), utterances from different speakers are assigned distinct speaker_label values (Speaker 0, Speaker 1, etc.).'
    verify: 'cd backend && pytest tests/test_diarization.py -q'
  - id: AC2
    behavior: 'When AsrModule text turns arrive with speaker_label="auto" and conversational handoffs/gaps, AsrHandler attributes turns across speakers rather than hardcoding every turn to Speaker 0 (Wearer).'
    verify: 'cd backend && pytest tests/test_diarization.py -q'
  - id: AC3
    behavior: 'Explicit speaker labels (e.g., from simulated voice notes or calibrated speakers) are preserved unchanged.'
    verify: 'cd spectacles-lens && npm test && cd ../backend && pytest -m "not integration" -q'
risks_vulnerabilities:
  - risk: 'Heuristic speaker-turn switching on text-only ASR can misattribute back-to-back sentences by the same speaker after a long pause.'
    mitigation: 'Only switch speakers on text-only turns when silenceGapMs exceeds threshold (e.g., >2500ms) AND conversational polarity shifts (e.g., question followed by answer), or when Deepgram audio diarization is active.'
knowledge_gaps: []
