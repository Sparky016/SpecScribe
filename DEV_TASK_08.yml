source: "SPEC_DOC.md §4.8 (Finding #13)"

objective: |
  Enforce integer milliseconds (`timestamp_ms`) as the sole canonical timestamp representation
  on the network wire, deprecating redundant cross-stack string parsing and consolidating
  all client-side human display formatting into a dedicated web utility module.

scope:
  in:
    - "Create web-dashboard/lib/formatters.ts with formatTimestamp(ms: number): string"
    - "Update web-dashboard/lib/api.ts to import and re-export or use formatTimestamp from formatters.ts"
    - "Scope Python format_timestamp_ms in backend/agents/spec_generator.py exclusively to static markdown compilation"
    - "Ensure all timeline payloads emit raw integer milliseconds"
  out:
    - "Do not alter database column timestamp_ms (already integer)"
    - "Do not break Next.js UI display strings ([MM:SS])"

files:
  "web-dashboard/lib/formatters.ts": "Create dedicated UI formatting utility module"
  "web-dashboard/lib/api.ts": "Delegate formatting to formatters.ts"
  "backend/agents/spec_generator.py": "Document internal-only usage of format_timestamp_ms"

implementation_notes: |
  In `web-dashboard/lib/formatters.ts`:
  ```typescript
  export function formatTimestamp(ms: number): string {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
  }

  export function parseTimestamp(label: string): number {
    const clean = label.replace(/[\[\]\s]/g, "");
    const parts = clean.split(":");
    if (parts.length === 2) {
      const min = parseInt(parts[0], 10);
      const sec = parseInt(parts[1], 10);
      if (!isNaN(min) && !isNaN(sec)) {
        return (min * 60 + sec) * 1000;
      }
    }
    return 0;
  }
  ```

