objective: |
  The Lens Studio MCP bearer token is hardcoded in .mcp.json and 103 files under spectacles-lens/scripts/. After this task every script imports one client that reads process.env.LS_MCP_TOKEN, .mcp.json is gitignored, and a token-free .mcp.example.json is committed.
scope:
  in:
  - Create spectacles-lens/scripts/lib/mcpClient.js exporting the request helper currently duplicated (see scripts/mcp_call.js:10)
  - Replace every hardcoded `Bearer <token>` in spectacles-lens/scripts/* with the shared client
  - Add .mcp.json to .gitignore; `git rm --cached .mcp.json`; commit .mcp.example.json with `${LS_MCP_TOKEN}` placeholder
  out:
  - Rotating the token or rewriting git history (task 09)
  - Deleting/triaging scripts (task 51)
  - Changing what scripts do
files:
  spectacles-lens/scripts/lib/mcpClient.js: create
  spectacles-lens/scripts/*.js|*.ps1: replace inline token with shared client / $env:LS_MCP_TOKEN
  .mcp.json: untrack
  .mcp.example.json: create
  .gitignore: add .mcp.json
implementation_notes: |
  PowerShell scripts: read `$env:LS_MCP_TOKEN`. Fail fast with a clear message when the env var is missing. Mechanical edit — a scripted sed is acceptable, but diff-review a sample.
acceptance_criteria:
- id: AC1
  behavior: No bearer token literal remains in tracked files
  verify: git grep -nE 'Bearer [A-Za-z0-9]{12,}' returns nothing
- id: AC2
  behavior: .mcp.json is untracked and ignored
  verify: git ls-files .mcp.json returns nothing; git check-ignore .mcp.json succeeds
- id: AC3
  behavior: Scripts read the token from env
  verify: grep -rln LS_MCP_TOKEN spectacles-lens/scripts | wc -l >= number of previously affected scripts
- id: AC4
  behavior: Shared client loads
  verify: node -e "require('./spectacles-lens/scripts/lib/mcpClient.js')"
risks_vulnerabilities:
- risk: Token still in git history
  mitigation: Task 09 (human) rotates it, making history copies useless
knowledge_gaps:
