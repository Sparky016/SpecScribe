objective: |
  Enable the whiteboard vision + drawio-mcp pipeline to handle erased nodes,
  renamed shapes, and rewired arrows on the physical whiteboard. Currently,
  GraphDeltaSchema (backend/graph_engine.py:68-74) and LiveGraphSession.apply_delta()
  are strictly additive (`added_vertices` and `added_edges` only), and
  extract_graph_delta_from_gemini() only passes existing vertex names (not edges)
  in the prompt. If a meeting participant erases a box or redraws an arrow on the
  whiteboard, the AR overlay retains the stale boxes and arrows permanently.
scope:
  in:
    - backend/graph_engine.py
    - backend/tests/test_graph_engine.py
  out:
    - Lens Studio rendering (DiagramOverlayView already swaps the full PNG texture)
files:
  backend/graph_engine.py: 'Extend GraphDeltaSchema with removed_vertices, removed_edges, and updated_vertices; pass both existing vertices and existing edges into the Gemini vision prompt; update LiveGraphSession.apply_delta() to delete/rename/rewire mxCells in the DrawioFile model before running relayout_diagram.'
  backend/tests/test_graph_engine.py: 'Add unit tests verifying vertex removal, vertex rename, and edge removal/rewiring in LiveGraphSession.apply_delta() and extract_graph_delta_from_gemini().'
implementation_notes: |
  1. In `backend/graph_engine.py`:
     - Add Pydantic models:
       ```python
       class UpdatedVertexSchema(BaseModel):
           old_label: str = Field(description="Existing label of the shape on the board")
           new_label: str = Field(description="Updated label written on the board")
           node_type: Optional[Literal["service", "database", "client", "decision"]] = None

       class RemovedEdgeSchema(BaseModel):
           source_label: str
           target_label: str
       ```
     - Extend `GraphDeltaSchema` with:
       - `removed_vertices: List[str] = Field(default_factory=list, description="Exact labels of existing vertices that were visibly erased from the whiteboard")`
       - `updated_vertices: List[UpdatedVertexSchema] = Field(default_factory=list, description="Existing vertices whose label or type was modified")`
       - `removed_edges: List[RemovedEdgeSchema] = Field(default_factory=list, description="Existing edges whose arrow was erased from the whiteboard")`
  2. In `LiveGraphSession`:
     - Add `get_existing_edges_summary() -> List[str]` returning `["Source -> Target", ...]`.
     - In `apply_delta(delta: GraphDeltaSchema)`:
       a. Process `updated_vertices`: update the mxCell `value` in `self.diagram` and re-key `self.label_to_id`.
       b. Process `removed_edges`: remove matching edge mxCells from `self.diagram.cells` and `self.edge_set`.
       c. Process `removed_vertices`: remove the vertex mxCell and any incident edge mxCells from `self.diagram.cells`, `self.label_to_id`, and `self.edge_set`.
       d. Process `added_vertices` and `added_edges` as before, then run `relayout_diagram`.
  3. In `extract_graph_delta_from_gemini()`:
     - Include both `existing_nodes` and `existing_edges` in the system prompt, with clear instructions only to populate `removed_vertices` / `removed_edges` when `person_occluding_board` is `False` and the shape/arrow is clearly erased (never remove nodes simply because a person is standing in front of them).
acceptance_criteria:
  - id: AC1
    behavior: 'LiveGraphSession.apply_delta() removes erased vertices and their incident edges from the Draw.io XML and internal lookup maps.'
    verify: 'cd backend && pytest tests/test_graph_engine.py -k "remove or update" -q'
  - id: AC2
    behavior: 'LiveGraphSession.apply_delta() renames updated vertices and removes erased edges while preserving remaining graph structure.'
    verify: 'cd backend && pytest tests/test_graph_engine.py -q'
  - id: AC3
    behavior: 'When person_occluding_board is True, apply_delta is skipped so occluded shapes are never accidentally deleted.'
    verify: 'cd backend && pytest tests/test_graph_engine.py -q'
risks_vulnerabilities:
  - risk: 'Partial camera framing or temporary occlusion could be mistaken for an erased node.'
    mitigation: 'Instruct Gemini in the system prompt to emit removed_vertices ONLY when the whiteboard surface where the node previously sat is clearly visible and blank, and ignore all removals if person_occluding_board is True.'
knowledge_gaps: []
commit_message: |
  feat(graph): support vertex/edge removal and renaming in GraphDeltaSchema and LiveGraphSession (Task 59)

