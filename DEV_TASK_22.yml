objective: |
  The renderer screenshots before render completes (can stream the previous diagram), has no timeouts while holding a global lock, and never recovers after a Chromium crash. After this task renders wait for a completion signal, are bounded by a timeout, and a crashed browser is restarted.
scope:
  in:
  - Set window.__renderDone=false before, true after render inside the evaluate promise; await page.wait_for_function(..., timeout=500)
  - Wrap the whole render in asyncio.wait_for(..., 2.0)
  - 'On playwright Error/TargetClosedError: mark not ready and restart (stop()+start()) once'
  - Expose public is_ready() for health (used by task 25)
  - Tests with a fake page object
  out:
  - Page pool (optional, out of scope)
  - Health endpoint changes (task 25)
files:
  backend/graph_engine.py: renderer class ~:315-343
  backend/test_orchestrator.py: renderer unit tests with fakes
implementation_notes: |
  Keep the integration-marked live renderer test deselected in CI. Do not hold the lock across the restart if it would deadlock — restart under the lock with a guard flag.
