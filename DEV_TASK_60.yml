objective: |
  Enhance the Raising-Hand AI Assistant orb so that when the user pinches the orb
  in HAND_RAISED state ("the AI assistant orb will then let the user know what
  the concern is"), it can optionally play synthesized spoken voice audio via
  AgentVoicePlayer in addition to displaying the 3-bullet ExpandedCritiqueCard,
  and guard the Unicode property escape regex (`\p{Extended_Pictographic}`) in
  RaisingHandAgentController.ts against embedded JS engine incompatibilities.
scope:
  in:
    - backend/agents/raising_hand_agent.py
    - backend/envelope_router.py
    - spectacles-lens/Assets/Scripts/RaisingHandAgentController.ts
    - spectacles-lens/Assets/Scripts/PersistentStreamSocketClient.ts
    - spectacles-lens/test/raising_hand_agent_controller.test.ts
    - backend/tests/test_raising_hand.py
  out:
    - Full duplex conversational voice agent
files:
  backend/agents/raising_hand_agent.py: 'Add optional TTS synthesis helper (using Deepgram Aura TTS when DEEPGRAM_API_KEY is available or Gemini audio output) that attaches an optional `audio_b64` payload or streams it when critique is requested.'
  spectacles-lens/Assets/Scripts/RaisingHandAgentController.ts: 'Wrap `\p{Extended_Pictographic}` regex in a try/catch with surrogate-pair fallback so older embedded JS engines never throw; support playing decoded voice audio on AgentVoicePlayer when pinched in HAND_RAISED state, falling back cleanly to AgentNotificationChime.wav.'
  spectacles-lens/test/raising_hand_agent_controller.test.ts: 'Add unit tests for Unicode regex fallback and voice readout trigger on orb pinch.'
implementation_notes: |
  1. In `spectacles-lens/Assets/Scripts/RaisingHandAgentController.ts`:
     - Replace line 501:
       ```typescript
       let clean = title.trim();
       try {
         clean = clean.replace(new RegExp('^(\\p{Extended_Pictographic}\\uFE0F?\\s*)+', 'u'), '').trim();
       } catch (_e) {
         clean = clean.replace(/^([\uD800-\uDBFF][\uDC00-\uDFFF]|\u26A0\uFE0F?|\s)+/, '').trim();
       }
       ```
       Using `new RegExp(..., 'u')` inside `try/catch` prevents a parse-time `SyntaxError`
       on JS engines that lack `\p{...}` Unicode property escapes.
  2. For `AgentVoicePlayer` spoken feedback:
     - Allow `CritiquePayload` in `RaisingHandAgentController.ts` to accept an optional
       `spoken_summary?: string` and `audio_b64?: string`.
     - When `handleOrbPinched()` expands the critique card (`this.isCardExpanded === true`),
       play the voice clip on `this.voiceAudioComponent` if provided, or play the low-latency
       notification chime fallback while displaying the critique card.
acceptance_criteria:
  - id: AC1
    behavior: 'formatPillText() uses a runtime-guarded RegExp for emoji stripping that cannot throw a parse-time or runtime SyntaxError on non-Extended_Pictographic JS engines.'
    verify: 'cd spectacles-lens && npm test'
  - id: AC2
    behavior: 'Pinching the orb in HAND_RAISED state expands the critique card and triggers voice/audio playback via AgentVoicePlayer.'
    verify: 'cd spectacles-lens && npm test && cd ../backend && pytest tests/test_raising_hand.py -q'
risks_vulnerabilities:
  - risk: 'Large base64 WAV payloads inside HAND_RAISED WebSocket messages could slow down JSON parsing on the Lens.'
    mitigation: 'Keep spoken summary under 15 seconds (compressed MP3/WAV < 64KB) or synthesize only when requested, with instant chime fallback.'
knowledge_gaps: []
