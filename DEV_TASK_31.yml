objective: |
  On any backend error the dashboard silently shows DEMO_TIMELINE, keyword-canned RAG answers with fake citations, and demo exports under a real meeting's ID. After this task demo data is used only when id === DEMO_MEETING_ID; otherwise users see explicit error/loading states and route handlers return 502.
scope:
  in:
  - 'lib/api.ts (~:69-81, ~:106-176, ~:193, ~:198): demo fallback only for DEMO_MEETING_ID; remove keyword canned answers for non-demo IDs'
  - Route handlers return 502 with {error} on backend failure; ask/route.ts must not call the backend twice
  - Page initial state null + loading skeleton; error banner with retry
  - Disable exports when the field is missing
  out:
  - Pagination (task 35)
  - Visual redesign
files:
  web-dashboard/lib/api.ts: fallback logic
  web-dashboard/app/api/meetings/[id]/timeline/route.ts: '502'
  web-dashboard/app/api/meetings/[id]/ask/route.ts: 502, single backend call
  web-dashboard/app/meetings/[id]/page.tsx: loading/error state (~:21)
  web-dashboard/components/TopBar.tsx: disable exports when missing
implementation_notes: |
  Keep DEMO_TIMELINE for the demo ID so the public demo still works offline.
