objective: |
  LiveGraphSession.add_node (backend/graph_engine.py:118-139) dedupes by lowercase label and restyles the existing cell, leaving node_metadata stale. After this task an existing node is reused only when label AND type match; otherwise a new node is created, and diff_summary reports added vs updated correctly.
scope:
  in:
  - Change dedupe key to (lower_label, node_type)
  - When restyling is still needed (same label, explicit type change requested), update node_metadata[...]['type']
  - Return/record whether the node was added or reused; surface in diff_summary
  - Empty/None label → backend generates f'{prefix} {n}'
  - Tests
  out:
  - Lens-side phrase consumption (task 27)
  - Node registry refactor (task 47)
files:
  backend/graph_engine.py: add_node dedupe + metadata
  backend/envelope_router.py: ADD_NODE handler uses added/reused flag in diff_summary
  backend/test_agents.py: tests (or backend/test_graph_engine.py)
implementation_notes: |
  Keep node_by_label map but key by f'{type}:{label}', or add a second map. Prefix comes from backend/node_registry.py.
