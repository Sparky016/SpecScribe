objective: |
  Meetings created via /ws/meeting/{id} never get a meetings row, and the Lens default `demo-session-01` isn't a UUID, so every child insert fails the FK and is swallowed — live meetings exist only in memory. After this task get_or_create_session validates UUIDs and upserts the meetings row, and persistence failures log at ERROR.
scope:
  in:
  - 'In SessionManager.get_or_create_session (backend/session_manager.py:73-85): validate uuid.UUID(meeting_id); upsert meetings row (on_conflict=''id'')
    via asyncio.to_thread when Supabase configured'
  - 'WebSocket: close with code 4400 for non-UUID IDs (allow the literal demo ID only when SPECSCRIBE_DEMO_MODE=1, mapping it to a fixed UUID
    constant)'
  - Upgrade insert-failure logs (session_manager.py:120-128,158-167) from WARNING to ERROR with exc_info
  - Tests with a fake Supabase client verifying upsert precedes child inserts
  out:
  - Lens default URL / ID change (task 38)
  - Session eviction (task 23)
  - Background task tracking (task 21)
files:
  backend/session_manager.py: UUID validation, meetings upsert, ERROR logging
  backend/main.py: 4400 close for invalid IDs in ws endpoint
  backend/test_orchestrator.py: tests
