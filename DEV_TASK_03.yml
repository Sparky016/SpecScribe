  backend/main.py: attach dependency to routes (lines ~181-475); token check in websocket endpoint before accept()
  backend/test_orchestrator.py: add auth tests; pass token in existing client calls (use a fixture setting SPECSCRIBE_API_TOKEN)
implementation_notes: |
  Use `hmac.compare_digest`. Keep /api/health public for Cloud Run probes. Do not log the token. Existing tests use FastAPI TestClient — add a conftest-style fixture that sets the env var via monkeypatch. Do not remove --allow-unauthenticated from deploy.yml (app-level auth replaces IAM auth so the Lens can connect).
