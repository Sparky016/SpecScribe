objective: |
  No backend route checks credentials and Cloud Run is deployed --allow-unauthenticated, so anyone with a meeting ID can read transcripts, inject into live meetings, and burn Gemini quota. After this task every /api/* route (except /api/health) and /ws/meeting/{id} require a shared secret from env SPECSCRIBE_API_TOKEN.
scope:
  in:
  - 'FastAPI dependency `require_api_token` in a new backend/auth.py comparing `Authorization: Bearer <t>` with hmac.compare_digest'
  - Apply it to every router/route in backend/main.py except GET /api/health
  - 'WebSocket: read `token` query param, close with code 4401 BEFORE accept() when invalid'
  - 'If SPECSCRIBE_API_TOKEN is unset: refuse to start unless SPECSCRIBE_AUTH_DISABLED=1 (log a WARNING when disabled)'
  - Tests covering 401 / 4401 / success paths; update existing tests to send the token
  out:
  - Rate limiting (task 04)
  - Dashboard proxy changes (task 05)
  - Lens client token wiring (task 38)
  - Per-user auth / Supabase Auth
  - Secret provisioning (task 06)
files:
  backend/auth.py: 'create: require_api_token dependency + ws_token_ok(websocket) helper'
  backend/main.py: attach dependency to routes (lines ~181-475); token check in websocket endpoint before accept()
  backend/test_orchestrator.py: add auth tests; pass token in existing client calls (use a fixture setting SPECSCRIBE_API_TOKEN)
implementation_notes: |
  Use `hmac.compare_digest`. Keep /api/health public for Cloud Run probes. Do not log the token. Existing tests use FastAPI TestClient — add a conftest-style fixture that sets the env var via monkeypatch. Do not remove --allow-unauthenticated from deploy.yml (app-level auth replaces IAM auth so the Lens can connect).
acceptance_criteria:
- id: AC1
  behavior: Unauthenticated REST calls return 401
  verify: pytest test asserting GET /api/meetings/<id>/timeline without header == 401
- id: AC2
