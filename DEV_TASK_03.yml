objective: |
  No backend route checks credentials and Cloud Run is deployed --allow-unauthenticated, so anyone with a meeting ID can read transcripts, inject into live meetings, and burn Gemini quota. After this task every /api/* route (except /api/health) and /ws/meeting/{id} require a shared secret from env SPECSCRIBE_API_TOKEN.
scope:
  in:
  - 'FastAPI dependency `require_api_token` in a new backend/auth.py comparing `Authorization: Bearer <t>` with hmac.compare_digest'
  - Apply it to every router/route in backend/main.py except GET /api/health
  - 'WebSocket: read `token` query param, close with code 4401 BEFORE accept() when invalid'
  - 'If SPECSCRIBE_API_TOKEN is unset: refuse to start unless SPECSCRIBE_AUTH_DISABLED=1 (log a WARNING when disabled)'
  - Tests covering 401 / 4401 / success paths; update existing tests to send the token
