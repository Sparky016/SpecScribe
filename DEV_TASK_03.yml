  verify: cd backend && pytest -m "not integration" -q
risks_vulnerabilities:
- risk: Breaking the Lens and dashboard until they send the token
  mitigation: Tasks 05 and 38 add the token; SPECSCRIBE_AUTH_DISABLED=1 is the documented local-dev escape hatch
- risk: Token leaks via logs/query strings
  mitigation: Never log the token; document that ?token= is only for the WS handshake
