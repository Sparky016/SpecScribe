objective: |
  Route params are interpolated unencoded into backend URLs, so `..%2F..%2Fhealth%3F` turns the dashboard into a proxy to arbitrary backend paths. After this task IDs are validated and encoded everywhere a backend URL is built.
scope:
  in:
  - Shared `isValidMeetingId(id)` accepting UUIDs and the demo IDs (`demo`, `demo-session-01`)
  - Return 400 from route handlers for invalid IDs
  - Use encodeURIComponent(id) in every backend URL (route handlers + lib/api.ts lines ~53, ~90)
  out:
  - Backend-side UUID validation (task 12)
  - Demo fallback behaviour (task 31)
files:
  web-dashboard/lib/meetingId.ts: create validator
  web-dashboard/app/api/meetings/[id]/ask/route.ts: validate + encode
  web-dashboard/app/api/meetings/[id]/timeline/route.ts: validate + encode
  web-dashboard/lib/api.ts: encode
implementation_notes: |
  Regex: /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i or exact demo IDs. Reuse backendFetch from task 05.
