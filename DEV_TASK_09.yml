source: "SPEC_DOC.md §4.7 (Finding #12)"

objective: |
  Modify RaisingHandAgentController.ts so that the idle pulse animation modulates relative to
  the object's original Inspector transform scale (`initialScale`) rather than snapping to a
  hardcoded unit vector `(1.0, 1.0, 1.0)`, preserving 3D artist mesh sizing in Lens Studio.

scope:
  in:
    - "Add initialScale: vec3 private field in RaisingHandAgentController.ts"
    - "Capture transform.getLocalScale() on start / onAwake"
    - "Multiply pulse factor by initialScale in onUpdate for AgentState.IDLE"
    - "Add unit test in spectacles-lens/tests/components.test.mjs verifying relative scaling"
  out:
    - "Do not alter research ring rotation animation"
    - "Do not change pulse frequency (2.5) or amplitude (0.05)"

files:
  "spectacles-lens/Assets/Scripts/RaisingHandAgentController.ts": "Scale relative to initial local scale"
  "spectacles-lens/tests/components.test.mjs": "Assert pulse respects initial non-unit mesh scale"

implementation_notes: |
  In `spectacles-lens/Assets/Scripts/RaisingHandAgentController.ts`:
  ```typescript
  private initialScale: vec3 = new vec3(1.0, 1.0, 1.0);

  onAwake(): void {
    this.createEvent('OnStartEvent').bind(() => {
      this.initScale();
    });
  }

  private initScale(): void {
    if (this.agentOrbMeshVisual) {
      const obj = this.agentOrbMeshVisual.getSceneObject();
      if (obj) {
        this.initialScale = obj.getTransform().getLocalScale();
      }
    }
  }

  private onUpdate(deltaTime: number): void {
    this.animTime += deltaTime;
    if (this.currentState === AgentState.IDLE && this.agentOrbMeshVisual) {
      const obj = this.agentOrbMeshVisual.getSceneObject();
      if (obj) {
        const pulse = 1.0 + 0.05 * Math.sin(this.animTime * 2.5);
        obj.getTransform().setLocalScale(new vec3(
          this.initialScale.x * pulse,
          this.initialScale.y * pulse,
          this.initialScale.z * pulse
        ));
      }
    }
    // ...
  }
  ```

acceptance_criteria:
