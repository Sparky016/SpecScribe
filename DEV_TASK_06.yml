source: "SPEC_DOC.md §4.6 (Finding #11)"

objective: |
  Add pagination (limit, offset) and temporal windowing (from_ms, to_ms) query parameters
  to `GET /api/meetings/{id}/timeline` in backend/main.py and update the web dashboard API client
  in web-dashboard/lib/api.ts, preventing multi-megabyte payload blowups during long sessions.

scope:
  in:
    - "Add limit (default 100, max 500), offset (default 0), from_ms, and to_ms parameters to GET /api/meetings/{id}/timeline"
    - "Apply pagination and time slicing to transcript_turns, diagram_snapshots, agent_interventions, and knowledge_chunks"
    - "Return pagination metadata object: {total_turns, limit, offset, has_more}"
    - "Update web-dashboard/lib/api.ts getMeetingTimeline function to support pagination query options"
  out:
    - "Do not break existing calls that omit pagination parameters (maintain default full/reasonable response)"

files:
  "backend/main.py": "Add pagination query params and slicing in get_meeting_timeline"
  "web-dashboard/lib/api.ts": "Add pagination parameters to getMeetingTimeline"

implementation_notes: |
  In `backend/main.py`:
  ```python
  @app.get("/api/meetings/{meeting_id}/timeline")
  async def get_meeting_timeline(
      meeting_id: str,
      limit: int = Query(default=100, ge=1, le=500),
      offset: int = Query(default=0, ge=0),
      from_ms: Optional[int] = Query(default=None, ge=0),
      to_ms: Optional[int] = Query(default=None, ge=0),
      session_mgr: SessionManager = Depends(get_session_manager),
  ):
  ```
  Filter helper:
  ```python
  def filter_by_window(items, from_t, to_t):
      res = items
      if from_t is not None:
          res = [x for x in res if x.get("timestamp_ms", 0) >= from_t]
      if to_t is not None:
          res = [x for x in res if x.get("timestamp_ms", 0) <= to_t]
      return res
  ```
  Paginate turns:
  ```python
  filtered_turns = filter_by_window(all_turns, from_ms, to_ms)
  total_turns = len(filtered_turns)
  paginated_turns = filtered_turns[offset : offset + limit]
  has_more = (offset + limit) < total_turns
  ```
  Include `"pagination": {"total_turns": total_turns, "limit": limit, "offset": offset, "has_more": has_more}` in response.

