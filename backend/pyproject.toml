[project]
name = "specscribe-backend"
version = "0.1.0"
description = "FastAPI Orchestrator, In-Memory drawio-mcp Engine & Raising-Hand Agent for Snap Spectacles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "supabase>=2.10.0",
    "google-genai>=0.1.1",
    "deepgram-sdk>=3.8.0",
    "drawio-mcp>=0.1.0",
    "playwright>=1.48.0",
    "imagehash>=4.3.1",
    "pillow>=11.0.0",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
