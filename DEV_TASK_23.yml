objective: |
  live_sessions, memory_store and agent histories are never evicted, and any meeting ID creates state (combined with no-auth, an OOM vector). /timeline returns 200 with a made-up title for unknown IDs. After this task REST routes 404 unknown meetings, idle sessions are evicted, and a session cap exists.
scope:
  in:
  - REST routes (/timeline, /finalize, /proactive-critique, /ask) return 404 when meeting not in memory or Supabase — do not create sessions
  - Remove the made-up title fallback (main.py ~:284-291)
  - Evict session (+ agent history, loops) when last WebSocket disconnects and after idle TTL (env, default 30 min) via periodic sweep
  - Cap live sessions (env, default 50); reject new WS with 4429 when full
  - Tests
  out:
  - Auth (task 03)
  - Persistence of evicted sessions beyond what Supabase already stores
files:
  backend/session_manager.py: evict(), sweep, cap
  backend/main.py: 404s; ws finally → evict when last socket leaves; lifespan sweep task
  backend/agents/raising_hand_agent.py: clear _history/_last_intervention_time on evict
  backend/test_orchestrator.py: tests
implementation_notes: |
