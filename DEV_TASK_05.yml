objective: |
  After task 03 the backend rejects unauthenticated calls. The Next.js route handlers must add `Authorization: Bearer ${process.env.SPECSCRIBE_API_TOKEN}` server-side so the token never reaches the browser.
scope:
  in:
  - Add the header in every server-side fetch to BACKEND_URL (web-dashboard/app/api/**/route.ts and server-only paths in lib/api.ts)
  - Ensure the token is only read in server code (no NEXT_PUBLIC_ prefix)
  - Document the env var in web-dashboard README/.env.example
  out:
  - Removing demo fallbacks (task 31)
  - Meeting ID validation (task 07)
files:
  web-dashboard/app/api/meetings/[id]/ask/route.ts: add auth header
  web-dashboard/app/api/meetings/[id]/timeline/route.ts: add auth header
  web-dashboard/lib/api.ts: add header for server-side backend calls; browser calls must go through /api routes
  web-dashboard/.env.example: add SPECSCRIBE_API_TOKEN=
implementation_notes: |
  Create a single helper `backendFetch(path, init)` in web-dashboard/lib/backend.ts (server-only; `import 'server-only'` if available) and use it from route handlers.
acceptance_criteria:
- id: AC1
  behavior: All server-side backend fetches send the bearer header
  verify: grep -rn "BACKEND_URL\|backendFetch" web-dashboard/app web-dashboard/lib — every fetch goes through backendFetch
- id: AC2
  behavior: Token is never exposed to the client bundle
  verify: grep -rn NEXT_PUBLIC_SPECSCRIBE web-dashboard returns nothing
- id: AC3
  behavior: Dashboard type-checks and builds
  verify: cd web-dashboard && npx tsc --noEmit && cd web-dashboard && npm run build
risks_vulnerabilities:
- risk: Client components calling the backend directly would need the token
  mitigation: Route all browser calls through /api handlers
knowledge_gaps: []
