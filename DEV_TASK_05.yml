source: "SPEC_DOC.md §4.2 (Finding #7)"

objective: |
  Decompose the monolithic 255-line `meeting_websocket_hub` god-function in backend/main.py
  into an EnvelopeRouter that dispatches to modular single-responsibility message handlers
  (HandshakeHandler, AsrHandler, CameraFrameHandler, PinchCommandHandler) satisfying SRP.

scope:
  in:
    - "Create backend/envelope_router.py with BaseEnvelopeHandler and EnvelopeRouter"
    - "Implement HandshakeHandler for device protocol handshakes and initial diagram sync"
    - "Implement AsrHandler for transcript turn storage and broadcast"
    - "Implement CameraFrameHandler for perceptual hash diffing, async Gemini extraction, and diagram render"
    - "Implement PinchCommandHandler for graph mutations with COMMAND_ERROR resilience"
    - "Refactor meeting_websocket_hub in backend/main.py to be a concise dispatch loop (<35 lines)"
  out:
    - "Do not alter the wire JSON protocol between Lens Studio / Web Dashboard and Backend"
    - "Do not remove COMMAND_ERROR or DIAGRAM_UPDATED event schemas"

files:
  "backend/envelope_router.py": "Create handler hierarchy and EnvelopeRouter dispatcher"
  "backend/main.py": "Replace inline message processing with EnvelopeRouter dispatch"

implementation_notes: |
  In `backend/envelope_router.py`:
  - `BaseEnvelopeHandler.handle(self, msg: Dict[str, Any], websocket: WebSocket, session_mgr: SessionManager, meeting_id: str)`
  - `EnvelopeRouter` registers handlers:
    `router.register("handshake", HandshakeHandler())`
    `router.register("asrTranscription", AsrHandler())`
    `router.register("cameraFrame", CameraFrameHandler())`
    `router.register("pinchCommand", PinchCommandHandler())`
  - In `backend/main.py`, `meeting_websocket_hub` simplifies to:
    ```python
    @app.websocket("/ws/meeting/{meeting_id}")
    async def meeting_websocket_hub(websocket: WebSocket, meeting_id: str):
        session_mgr = app.state.session_manager
        await websocket.accept()
        session_mgr.active_connections[meeting_id].add(websocket)
        session = session_mgr.get_or_create_session(meeting_id)

        # Proactive loop check
        if meeting_id not in session_mgr.raising_hand_agent._active_loops or session_mgr.raising_hand_agent._active_loops[meeting_id].done():
            session_mgr.raising_hand_agent.start_proactive_loop(
                meeting_id=meeting_id,
                interval_seconds=20.0,
                get_diagram_fn=lambda mid: session_mgr.live_sessions[mid].get_xml() if mid in session_mgr.live_sessions else "",
                get_timestamp_fn=lambda mid: int(datetime.now(timezone.utc).timestamp() * 1000),
                broadcast_fn=session_mgr.broadcast_to_meeting,
            )

        try:
            while True:
                raw_text = await websocket.receive_text()
                try:
                    msg = json.loads(raw_text)
                except Exception as e:
                    logger.warning("Malformed JSON: %s", e)
                    continue

                await envelope_router.dispatch(msg, websocket, session_mgr, meeting_id)
        except WebSocketDisconnect:
            logger.info("Client disconnected: %s", meeting_id)
        finally:
            session_mgr.active_connections[meeting_id].discard(websocket)
    ```

