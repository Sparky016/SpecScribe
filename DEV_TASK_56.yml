id: '56'
title: 'Fix Backend Vision Cooldown Gate (_last_vision_time) & Support Immediate Manual Capture'
phase: 2
severity: high
complexity: low
effort: low
eval_effort: low
depends_on: ['54']
status: PENDING
source: 'MVP_READY.md #GAP-7'
human_action: none
decision_log:
  outcome: pending
  rework_cycles: 0
  escalated: false
  history: []
