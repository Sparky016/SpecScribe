  evaluator_verdicts: []
objective: |
  Ensure the backend honours both the 3-second Frequency mode (AUTO) and
  on-demand Manual mode (MANUAL) without silently dropping frames. Currently,
  CameraFrameHandler in backend/envelope_router.py enforces a 5.0-second cooldown
  (now - _last_vision_time < 5.0) AND stamps _last_vision_time = now BEFORE
  check_image_diff() runs. As a result:
  (1) Static frames that cost 0 Gemini calls still reset the 5-second cooldown timer.
  (2) A 3.0-second AUTO capture loop has every second tick (t=3s, t=9s, t=15s)
      dropped, turning a 3-second mode into a 6-second mode.
  (3) A manual capture pinched within 5 seconds of a background frame is silently
      ignored with no response sent to the glasses.
scope:
  in:
    - backend/envelope_router.py
    - spectacles-lens/Assets/Scripts/PeriodicCameraCapturer.ts
    - backend/tests/test_main.py
    - spectacles-lens/test/periodic_camera_capturer.test.ts
  out:
    - Gemini prompt changes (covered in DEV_TASK_59.yml)
files:
  spectacles-lens/Assets/Scripts/PeriodicCameraCapturer.ts: 'Include captureMode ("AUTO" | "MANUAL") and isManualTrigger (boolean) in the cameraFrame WebSocket payload.'
  backend/envelope_router.py: 'In CameraFrameHandler.handle, allow manual triggers (isManualTrigger=True) to bypass the cooldown, reduce AUTO cooldown from 5.0s to 2.5s (compatible with 3.0s cadence), and update session._last_vision_time = now ONLY after check_image_diff confirms a visual change (or manual trigger).'
  backend/tests/test_main.py: 'Add unit tests verifying (a) unchanged frames do not reset _last_vision_time, (b) 3.0s AUTO frames pass the 2.5s cooldown, and (c) manual capture frames bypass cooldown.'
implementation_notes: |
  1. In `spectacles-lens/Assets/Scripts/PeriodicCameraCapturer.ts`:
     - Pass a parameter `isManual: boolean = false` into `captureAndEncodeFrame(isManual: boolean = false)`.
     - In `onUpdate()`, call `this.captureAndEncodeFrame(false)`.
     - In `triggerManualCapture()`, call `this.captureAndEncodeFrame(true)`.
     - In the `socketClient.send` payload for `cameraFrame`, include:
       `captureMode: this.captureMode === CaptureMode.MANUAL ? 'MANUAL' : 'AUTO'`,
       `isManual: isManual`.
  2. In `backend/envelope_router.py` (`CameraFrameHandler.handle`):
     - Read `is_manual = bool(payload.get("isManual", False) or payload.get("captureMode") == "MANUAL")`.
     - Set `VISION_COOLDOWN_SEC = 2.5` so a 3.0-second periodic sender is not throttled into 6.0s.
     - Check cooldown:
       ```python
       if not is_manual and (now - getattr(session, "_last_vision_time", 0) < 2.5):
           logger.debug("Vision analysis cooldown active; skipping frame.")
           return
       ```
     - Run `has_diff = await asyncio.to_thread(session.check_image_diff, raw_bytes)` FIRST
       (unless `is_manual` is True, in which case still compute `check_image_diff` to update
       `_last_image_hash`, or allow `is_manual` to proceed even on subtle sketches).
     - If `not has_diff and not is_manual`:
       return WITHOUT updating `session._last_vision_time`.
     - Only set `session._last_vision_time = now` right before calling
       `extract_graph_delta_from_gemini(...)`.
acceptance_criteria:
  - id: AC1
    behavior: 'A static camera frame (check_image_diff == False) does not update session._last_vision_time, so a changed frame arriving 3.0s later is processed immediately.'
    verify: 'cd backend && pytest tests/test_main.py -k "cooldown or camera_frame" -q'
  - id: AC2
    behavior: 'Continuous changed frames arriving at 3.0s intervals in AUTO mode pass the 2.5s cooldown gate.'
    verify: 'cd backend && pytest tests/test_main.py -q'
  - id: AC3
    behavior: 'A cameraFrame with isManual=True bypasses the cooldown timer and processes immediately.'
    verify: 'cd backend && pytest tests/test_main.py -q && cd ../spectacles-lens && npm test'
risks_vulnerabilities:
  - risk: 'Rapidly pinching the manual capture button could trigger concurrent Gemini calls.'
    mitigation: 'Enforce a minimal 1.0s debounce on manual triggers or guard with an in-flight per-session asyncio.Lock.'
knowledge_gaps: []
commit_message: |
  fix(vision): update _last_vision_time only after image diff and support 3s AUTO / immediate MANUAL capture (Task 56)

