id: "01"
title: "Implement Supabase Row-Level Security Policies"
phase: 1
severity: medium
complexity: medium
model: sonnet
effort: medium
eval_model: sonnet
eval_effort: low
depends_on: []
status: PENDING
source: "SPEC_DOC.md §4.4 (Finding #9)"

objective: |
  Enable Row-Level Security (RLS) on all 5 Supabase tables (meetings, transcript_turns,
  diagram_snapshots, agent_interventions, knowledge_chunks) via an additive migration,
  defining distinct policies for service_role and public anonymous clients to secure the
  database without breaking existing backend and web-dashboard flows.

scope:
  in:
    - "Create supabase/migrations/002_enable_rls.sql"
    - "Enable RLS on meetings, transcript_turns, diagram_snapshots, agent_interventions, knowledge_chunks"
    - "Create service_role full-access policy for all operations across all 5 tables"
    - "Create public anon SELECT policies for meetings, transcript_turns, diagram_snapshots, agent_interventions, knowledge_chunks"
    - "Create public anon INSERT policies for meetings and transcript_turns"
    - "Ensure immutable history policies preventing anon UPDATE and DELETE on audit logs"
  out:
    - "Do not modify supabase/migrations/001_initial_schema.sql"
    - "Do not alter application-layer Supabase client initialization"

files:
  "supabase/migrations/002_enable_rls.sql": "Create additive migration enabling RLS and declaring policies"

implementation_notes: |
  Follow PostgreSQL RLS syntax:
  - `ALTER TABLE meetings ENABLE ROW LEVEL SECURITY;` (repeated for all 5 tables)
  - Service role policy: `CREATE POLICY "Service role full access" ON <table> FOR ALL USING (auth.role() = 'service_role') WITH CHECK (auth.role() = 'service_role');`
  - Anon select policy: `CREATE POLICY "Public read access" ON <table> FOR SELECT USING (true);`
  - Anon insert policy: `CREATE POLICY "Public insert access" ON meetings FOR INSERT WITH CHECK (true);`
  - Prevent UPDATE/DELETE from anonymous roles by omitting non-service_role UPDATE/DELETE policies.

acceptance_criteria:
  - id: AC1
    behavior: "Migration file supabase/migrations/002_enable_rls.sql exists and is syntactically valid SQL"
    verify: "test -f supabase/migrations/002_enable_rls.sql"
  - id: AC2
    behavior: "All 5 tables (meetings, transcript_turns, diagram_snapshots, agent_interventions, knowledge_chunks) have ENABLE ROW LEVEL SECURITY statements"
    verify: "grep -c 'ENABLE ROW LEVEL SECURITY' supabase/migrations/002_enable_rls.sql"
  - id: AC3
    behavior: "Policies exist granting service_role full management access"
    verify: "grep 'service_role' supabase/migrations/002_enable_rls.sql"
  - id: AC4
    behavior: "001_initial_schema.sql remains unmodified (git diff 001_initial_schema.sql empty)"
    verify: "git diff --name-only supabase/migrations/001_initial_schema.sql"

risks_vulnerabilities:
  - risk: "Strict RLS could reject backend inserts if SUPABASE_SERVICE_KEY is misconfigured or uses an anon key"
    mitigation: "Include anon INSERT policy for meetings and transcript_turns to ensure zero downtime in local dev"

knowledge_gaps: []

commit_message: |
  feat(task-01): enable row-level security on supabase tables
