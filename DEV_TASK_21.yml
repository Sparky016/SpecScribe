objective: |
  asyncio.create_task results are discarded six times in envelope_router.py, so tasks can be GC'd and exceptions are never seen. After this task all fire-and-forget work goes through SessionManager.spawn, which holds references, logs exceptions, and cancels on shutdown.
scope:
  in:
  - SessionManager.spawn(coro) adding to self._bg_tasks with done-callback (log exception, discard)
  - Replace create_task calls at envelope_router.py ~:197-214, ~:265-282, ~:313-330
  - Cancel and await outstanding tasks in main.py lifespan shutdown
  - Test
  out:
  - Session eviction (task 23)
files:
  backend/session_manager.py: spawn + _bg_tasks
  backend/envelope_router.py: use spawn
  backend/main.py: lifespan shutdown
  backend/test_async_concurrency.py: test
implementation_notes: |
  Done callback: if not task.cancelled() and task.exception(): logger.error(..., exc_info=task.exception()).
