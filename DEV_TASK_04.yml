objective: |
  Unlimited calls to /ask, /finalize and /proactive-critique spend the project's Gemini quota. After this task those routes are rate-limited per client IP.
scope:
  in:
  - Add slowapi (or a small in-process token bucket if adding a dependency is rejected) to POST /api/meetings/{id}/ask, /finalize, /proactive-critique
  - Return 429 with Retry-After when exceeded; limits configurable via env (default 10/minute)
  - Tests for 429
  out:
  - Auth (task 03)
  - WebSocket message rate limits
  - Distributed/Redis-backed limiting
files:
  backend/main.py: decorate the three POST routes; register limiter + exception handler
  backend/requirements.txt: add slowapi with an upper-bounded version
  backend/test_orchestrator.py: 429 test
implementation_notes: |
  Cloud Run sits behind a proxy: key on the first X-Forwarded-For entry, falling back to request.client.host. Keep limits in env SPECSCRIBE_RATE_LIMIT.
