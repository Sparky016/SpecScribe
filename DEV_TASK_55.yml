id: '55'
title: 'Gate simulatedTexture & Video Auto-Bind Behind demoMode in PeriodicCameraCapturer and Clear Serialized Scene Defaults'
phase: 2
severity: high
complexity: low
effort: low
eval_effort: low
depends_on: ['34']
status: PENDING
source: 'MVP_READY.md #GAP-6'
human_action: HUMAN-STEP
decision_log:
  outcome: pending
  rework_cycles: 0
  escalated: false
  history: []
  decisions: []
  sticking_points: []
  repeated_work: []
  iterative_mistakes: []
  human_required:
    - 'In Lens Studio Inspector on SpecScribeControllers, verify simulatedTexture is cleared (or demoMode is false) and simulatedSpeechPhrase is empty before building for Spectacles hardware.'
  escalate: []
  evaluator_verdicts: []
objective: |
  Prevent the pre-recorded DemoVideo.mp4 texture (69b2b12f-15b1-44d5-9ca3-1da4b29caef0)
  from hijacking the live camera pipeline when running on physical Spectacles
  hardware or live webcam preview. Currently, PeriodicCameraCapturer.setupCameraPipeline()
  checks this.simulatedTexture (and auto-binds WhiteboardBackplate's video texture)
  BEFORE attempting LensStudio:CameraModule, and Scene.scene has simulatedTexture
  hardwired to DemoVideo.mp4 and simulatedSpeechPhrase hardwired to
  "Payment Gateway Microservice".
scope:
  in:
    - spectacles-lens/Assets/Scripts/PeriodicCameraCapturer.ts
    - spectacles-lens/Assets/Scripts/SpatialInterfaceManager.ts
    - spectacles-lens/Assets/Scene.scene
    - spectacles-lens/test/periodic_camera_capturer.test.ts
  out:
    - Backend vision processing
files:
  spectacles-lens/Assets/Scripts/PeriodicCameraCapturer.ts: 'Add @input demoMode: boolean = false; try CameraModule first when demoMode is false, and only fall back to simulatedTexture / WhiteboardBackplate texture when demoMode is true or CameraModule.requestCamera throws.'
  spectacles-lens/Assets/Scene.scene: 'Clear serialized simulatedSpeechPhrase ("Payment Gateway Microservice") on SpecScribeControllers and set demoMode: false by default for production/MVP readiness.'
  spectacles-lens/test/periodic_camera_capturer.test.ts: 'Add unit tests verifying CameraModule is preferred over simulatedTexture when demoMode is false, and simulatedTexture is used when demoMode is true or CameraModule fails.'
implementation_notes: |
  1. In PeriodicCameraCapturer.ts:
     - Add `@input demoMode: boolean = false;`.
     - Refactor `setupCameraPipeline()`:
       a. If `this.demoMode` is true and `this.simulatedTexture` (or `WhiteboardBackplate`
          texture) is present, bind `this.cameraTexture = this.simulatedTexture` and start
          playing if its control has `play()`.
       b. Otherwise (`this.demoMode === false`), attempt `require('LensStudio:CameraModule')`
          and `cameraModule.requestCamera(cameraRequest)` FIRST.
       c. Inside the `catch (e)` block when `CameraModule` is unavailable in headless/preview
          environments, fall back to `this.simulatedTexture` or the `WhiteboardBackplate`
          texture so Lens Studio Preview still works seamlessly.
  2. In Scene.scene:
     - On the `PreviewInputAdapter` / `SpatialInterfaceManager` component serialization
       (around line 311), replace `simulatedSpeechPhrase: Payment Gateway Microservice`
       with `simulatedSpeechPhrase: ""`.
acceptance_criteria:
  - id: AC1
    behavior: 'When demoMode is false and CameraModule is available, PeriodicCameraCapturer binds the live CameraModule texture even if simulatedTexture is assigned in the scene.'
    verify: 'cd spectacles-lens && npm test'
  - id: AC2
    behavior: 'When CameraModule throws (e.g., desktop preview without hardware camera) or demoMode is true, PeriodicCameraCapturer falls back cleanly to simulatedTexture / WhiteboardBackplate.'
    verify: 'cd spectacles-lens && npm test'
  - id: AC3
    behavior: 'Scene.scene no longer contains hardcoded simulatedSpeechPhrase: Payment Gateway Microservice.'
    verify: 'Select-String -Path "spectacles-lens/Assets/Scene.scene" -Pattern "Payment Gateway Microservice" returns 0 matches.'
risks_vulnerabilities:
  - risk: 'Breaking LEAF automated tests in Lens Studio Preview if CameraModule returns a blank webcam feed.'
    mitigation: 'Allow LEAF test runner or PreviewInputAdapter.demoMode to set periodicCapturer.demoMode = true during scripted demo scenarios.'
knowledge_gaps: []
commit_message: |
  fix(lens): prioritize live CameraModule when demoMode is false and clear scene demo phrase (Task 55)

