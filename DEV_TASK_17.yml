objective: |
  decision_linker silently stores SHA-256 'embeddings' on failure and mixes 768-dim (zero-padded) and 1536-dim vectors from different models in one pgvector column. After this task one model is pinned, its name is stored per row, and failures skip persistence instead of writing garbage.
scope:
  in:
  - Pin a single embedding model via env SPECSCRIBE_EMBEDDING_MODEL (default the 1536-dim model currently primary)
  - Remove text-embedding-004 fallback and _normalize_embedding_dim padding from the persistence path
  - 'On embedding failure: raise/return None and skip insert (log WARNING); deterministic vectors only when SPECSCRIBE_OFFLINE_EMBEDDINGS=1 (tests)'
  - Create supabase/migrations/005_embedding_model.sql adding `embedding_model text` to knowledge_chunks; write it on insert
  - Tests
  out:
  - Async conversion of fetch_recent_transcripts (task 18)
  - HNSW index (task 53)
  - Shared LLM helper (task 46)
